name: Kaito Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect Kaito source
        shell: bash
        run: |
          mkdir -p diagnostics extracted
          {
            echo "=== Repository files ==="
            find . -maxdepth 4 -type f \
              ! -path './.git/*' \
              ! -path './.github/*' \
              | sort
            echo
            echo "=== ZIP archives ==="
            find . -maxdepth 5 -type f \
              -iname '*.zip' \
              ! -path './.git/*' \
              -print
          } | tee diagnostics/repository.txt
          ZIP_FILE="$(find . -maxdepth 5 -type f \
            -iname 'Kaito-source.zip' \
            ! -path './.git/*' | head -1)"
          if [ -z "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 5 -type f \
              -iname '*.zip' \
              ! -path './.git/*' | head -1)"
          fi
          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP archive found." \
              | tee diagnostics/error.txt
          else
            echo "Archive: $ZIP_FILE" \
              | tee diagnostics/archive.txt
            unzip -l "$ZIP_FILE" \
              > diagnostics/zip-contents.txt 2>&1 || true
            unzip -o "$ZIP_FILE" -d extracted \
              > diagnostics/extract-log.txt 2>&1 || true
            {
              echo "=== Files inside extracted source ==="
              find extracted -type f \
                ! -path '*/node_modules/*' \
                | sort
              echo
              echo "=== File types ==="
              find extracted -type f \
                ! -path '*/node_modules/*' \
                -exec file {} \;
            } > diagnostics/source-details.txt 2>&1
            echo "=== ZIP contents ==="
            cat diagnostics/zip-contents.txt
            echo "=== Extracted source ==="
            cat diagnostics/source-details.txt
          fi
      - name: Prepare diagnostic artifact
        if: always()
        shell: bash
        run: |
          mkdir -p diagnostics
          if [ -d extracted ]; then
            find extracted -type f \
              ! -path '*/node_modules/*' \
              | sort > diagnostics/source-files.txt
          fi
          echo "Diagnostic collection completed."
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload extracted source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Extracted-Source
          path: extracted/
          if-no-files-found: warn
          retention-days: 7