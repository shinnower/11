name: Kaito Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Prepare workspace
        shell: bash
        run: |
          set -e
          mkdir -p source output diagnostics
      - name: Extract Kaito source
        shell: bash
        run: |
          set -e
          ZIP_FILE="Kaito-source.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 5 -type f \
              -iname '*.zip' \
              ! -path './.git/*' | head -1)"
          fi
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy file ZIP source."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source
          echo "=== Source files ==="
          find source -maxdepth 3 -type f | sort
      - name: Inspect build configuration
        shell: bash
        run: |
          set -e
          cd source
          echo "=== build.cjs ==="
          sed -n '1,160p' build.cjs
          echo "=== package.cjs ==="
          sed -n '1,160p' package.cjs
          echo "=== README.md ==="
          sed -n '1,200p' README.md
      - name: Build Kaito
        id: build
        shell: bash
        run: |
          set -e
          cd source
          echo "Node version:"
          node --version
          echo "Build directory:"
          pwd
          echo "Running build.cjs with source path..."
          node build.cjs "$PWD" \
            2>&1 | tee ../diagnostics/build.log
      - name: Run tests
        if: success()
        shell: bash
        run: |
          set -e
          cd source
          if [ -f test.cjs ]; then
            node test.cjs \
              2>&1 | tee ../diagnostics/test.log
          fi
          if [ -f verify-declarations.cjs ]; then
            node verify-declarations.cjs \
              2>&1 | tee ../diagnostics/verify.log
          fi
      - name: Collect output files
        if: always()
        shell: bash
        run: |
          mkdir -p output
          for DIR in \
            source/dist \
            source/build \
            source/out \
            source/artifacts
          do
            if [ -d "$DIR" ]; then
              cp -R "$DIR"/. output/ 2>/dev/null || true
            fi
          done
          echo "=== Output files ==="
          find output -type f | sort
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Build-Output
          path: output/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7