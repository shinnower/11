name: Kaito Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare tools
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Kaito source
        shell: bash
        run: |
          set -e

          mkdir -p source

          if [ -f "Kaito-source.zip" ]; then
            unzip -o "Kaito-source.zip" -d source
          else
            ZIP_FILE="$(find . -maxdepth 4 -type f -iname '*.zip' \
              ! -path './.git/*' | head -1)"

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::Không tìm thấy file ZIP source."
              exit 1
            fi

            echo "Extracting: $ZIP_FILE"
            unzip -o "$ZIP_FILE" -d source
          fi

          echo "=== Source files ==="
          find source -maxdepth 5 -type f \
            ! -path '*/node_modules/*' \
            | sort | head -300

          echo "=== Project manifests ==="
          find source -type f \( \
            -name package.json -o \
            -name package-lock.json -o \
            -name pnpm-lock.yaml -o \
            -name yarn.lock -o \
            -name '*.csproj' -o \
            -name '*.sln' -o \
            -name Cargo.toml -o \
            -name pyproject.toml -o \
            -name Makefile \
          \) ! -path '*/node_modules/*' -print

      - name: Install Node dependencies
        shell: bash
        run: |
          set -e

          PKG="$(find source -type f -name package.json \
            ! -path '*/node_modules/*' \
            | head -1)"

          if [ -z "$PKG" ]; then
            echo "Không có package.json; bỏ qua cài npm."
            exit 0
          fi

          PROJECT_DIR="$(dirname "$PKG")"
          cd "$PROJECT_DIR"

          echo "Node project: $PROJECT_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm install
          fi

      - name: Build Kaito project
        shell: bash
        run: |
          set -e

          PKG="$(find source -type f -name package.json \
            ! -path '*/node_modules/*' \
            | head -1)"

          if [ -n "$PKG" ]; then
            PROJECT_DIR="$(dirname "$PKG")"
            cd "$PROJECT_DIR"

            HAS_BUILD="$(node -e \
              "const p=require('./package.json'); \
              process.stdout.write(p.scripts?.build ? 'yes' : 'no')")"

            if [ "$HAS_BUILD" = "yes" ]; then
              npm run build
            else
              echo "::error::package.json không có script build."
              exit 1
            fi

          elif find source -type f \( \
            -name '*.csproj' -o \
            -name '*.sln' -o \
            -name Cargo.toml -o \
            -name pyproject.toml -o \
            -name Makefile \
          \) | grep -q .; then
            echo "::error::Đã tìm thấy manifest nhưng chưa xác định được lệnh build phù hợp."
            echo "Kiểm tra danh sách file ở bước Extract Kaito source."
            exit 1

          else
            echo "::error::Không tìm thấy cấu hình build được hỗ trợ trong source."
            echo "Không thể tạo artifact hợp lệ khi chưa biết loại dự án."
            exit 1
          fi

      - name: Collect generated files
        if: always()
        shell: bash
        run: |
          mkdir -p output

          for DIR in source/dist source/build source/out dist build out; do
            if [ -d "$DIR" ]; then
              cp -R "$DIR"/. output/ 2>/dev/null || true
            fi
          done

          find source -type f \( \
            -name 'Assembly-CSharp-patch.bytes' -o \
            -name 'localConfig.json' \
          \) ! -path '*/node_modules/*' \
            -exec cp --parents {} output/ \; 2>/dev/null || true

          echo "=== Output files ==="
          find output -type f | sort

      - name: Upload Kaito artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Build-Output
          path: output/**
          if-no-files-found: warn
          retention-days: 7