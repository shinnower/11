name: Kaito Build
on:
  workflow_dispatch:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Extract source
        shell: bash
        run: |
          set -e
          mkdir -p source diagnostics output
          ZIP_FILE="Kaito-source.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            ZIP_FILE="$(find . -maxdepth 5 -type f \
              -iname '*.zip' \
              ! -path './.git/*' | head -1)"
          fi
          if [ -z "$ZIP_FILE" ] || [ ! -f "$ZIP_FILE" ]; then
            echo "::error::Không tìm thấy file ZIP source."
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d source
      - name: Diagnose runtime preparation
        shell: bash
        run: |
          set -e
          {
            echo "=== All source files ==="
            find source -type f \
              ! -path '*/node_modules/*' | sort
            echo
            echo "=== Runtime preparation references ==="
            grep -RInE \
              'prepare-runtime-test|runtime-test|const core|path\.resolve' \
              source \
              --include='*.cjs' \
              --include='*.js' \
              --include='*.md' || true
            echo
            echo "=== build.cjs ==="
            sed -n '1,240p' source/build.cjs
            echo
            echo "=== package.cjs ==="
            sed -n '1,240p' source/package.cjs
            echo
            echo "=== README ==="
            sed -n '1,240p' source/README.md
          } | tee diagnostics/runtime-diagnosis.txt
      - name: Check required preparation script
        shell: bash
        run: |
          set -e
          PREP="$(find source -type f \
            -name 'prepare-runtime-test.cjs' \
            ! -path '*/node_modules/*' | head -1)"
          if [ -z "$PREP" ]; then
            echo "::error::Thiếu prepare-runtime-test.cjs trong source."
            echo "Không tự tạo runtime-test giả."
            echo "Xem artifact Kaito-Diagnostics để xác định source cần bổ sung."
            exit 1
          fi
          echo "Preparation script found: $PREP"
      - name: Prepare runtime test
        shell: bash
        run: |
          set -e
          PREP="$(find source -type f \
            -name 'prepare-runtime-test.cjs' \
            ! -path '*/node_modules/*' | head -1)"
          cd "$(dirname "$PREP")"
          node "$(basename "$PREP")"
      - name: Build Kaito
        shell: bash
        run: |
          set -e
          cd source
          node build.cjs "$PWD"
      - name: Run tests
        if: success()
        shell: bash
        run: |
          set -e
          cd source
          if [ -f test.cjs ]; then
            node test.cjs
          fi
          if [ -f verify-declarations.cjs ]; then
            node verify-declarations.cjs
          fi
      - name: Collect output
        if: always()
        shell: bash
        run: |
          mkdir -p output
          for DIR in \
            source/dist \
            source/build \
            source/out \
            source/artifacts \
            runtime-test
          do
            if [ -d "$DIR" ]; then
              cp -R "$DIR"/. output/ 2>/dev/null || true
            fi
          done
          echo "=== Output ==="
          find output -type f | sort
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 7
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Build-Output
          path: output/
          if-no-files-found: warn
          retention-days: 7