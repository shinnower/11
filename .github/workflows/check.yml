name: Kaito Build
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Inspect repository
        shell: bash
        run: |
          set -e
          echo "Repository root:"
          pwd
          echo "Files:"
          find . -maxdepth 4 -type f \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            | sort | head -500
          echo "Project manifests:"
          find . -maxdepth 5 -type f \
            \( -name package.json \
            -o -name package-lock.json \
            -o -name pnpm-lock.yaml \
            -o -name yarn.lock \
            -o -name '*.sln' \
            -o -name '*.csproj' \
            -o -name '*.xcodeproj' \
            -o -name '*.gradle' \
            -o -name Cargo.toml \
            -o -name pyproject.toml \
            -o -name Makefile \) \
            ! -path './.git/*' \
            ! -path './node_modules/*' \
            | sort
      - name: Setup Node.js
        if: ${{ hashFiles('package.json', '**/package.json') != '' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Node dependencies
        shell: bash
        run: |
          set -e
          if [ -f package.json ]; then
            cd .
          else
            PKG="$(find . -mindepth 2 -maxdepth 5 \
              -type f -name package.json \
              ! -path './node_modules/*' \
              ! -path './.git/*' | head -1)"
            if [ -z "$PKG" ]; then
              echo "No package.json found. This repository may not be a Node.js project."
              echo "Skipping npm installation."
              exit 0
            fi
            cd "$(dirname "$PKG")"
          fi
          echo "Node project directory: $(pwd)"
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f pnpm-lock.yaml ]; then
            corepack enable
            pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable
            yarn install --frozen-lockfile
          else
            npm install
          fi
      - name: Build Node project
        shell: bash
        run: |
          set -e
          PKG=""
          if [ -f package.json ]; then
            PKG="./package.json"
          else
            PKG="$(find . -mindepth 2 -maxdepth 5 \
              -type f -name package.json \
              ! -path './node_modules/*' \
              ! -path './.git/*' | head -1)"
          fi
          if [ -z "$PKG" ]; then
            echo "ERROR: No package.json found."
            echo "Cannot determine the build command automatically."
            echo "Check the repository files and select the correct build tool."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$PKG")"
          cd "$PROJECT_DIR"
          node -e "
            const p = require('./package.json');
            console.log('Package:', p.name || '(unnamed)');
            console.log('Scripts:', JSON.stringify(p.scripts || {}, null, 2));
            if (!p.scripts || !p.scripts.build) {
              console.error('ERROR: package.json has no build script.');
              process.exit(1);
            }
          "
          npm run build
      - name: Upload generated files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Kaito-Build-Output
          path: |
            **/Assembly-CSharp-patch.bytes
            **/localConfig.json
            **/dist/**
            **/build/**
            **/out/**
          if-no-files-found: warn
          retention-days: 7